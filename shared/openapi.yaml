  /api/v1/research/datasets/{dataset_id}/records:
    get:
      tags:
      - research
      summary: Numerical records of an imported dataset (paginated, filterable)
      description: 503 DATASET_UNAVAILABLE (details.status, details.source_url) when not imported. CMP_ANALYTE_V1 datasets
        fill `records` (filters subject_id, analyte, timepoint). GENE_EXPRESSION_V1 datasets (OSD-195, OSD-546) fill `expression_records`,
        `samples` and `comparison_readiness` (filters subject_id, sample_id, probe_id, gene_symbol). A filter that does not
        apply to the dataset's schema returns 422 INVALID_FILTER_FOR_DATASET.
      operationId: dataset_records_api_v1_research_datasets__dataset_id__records_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          title: Dataset Id
      - name: subject_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - C001
          title: Subject Id
      - name: analyte
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
