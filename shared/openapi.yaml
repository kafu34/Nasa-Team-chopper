          title: Analyte
      - name: timepoint
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - L-92
          title: Timepoint
      - name: sample_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - GSM2813750
          title: Sample Id
      - name: probe_id
        in: query
        required: false
        schema:
