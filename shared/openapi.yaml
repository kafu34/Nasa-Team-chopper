          title: Metric
      - name: instrument_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - DosTel1
          title: Instrument Id
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeseriesPage'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Dataset unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/emergencies:
    post:
      tags:
      - emergency
      summary: Activate the simulated emergency workflow (no localisation or equipment step required)
      description: 201 for a new activation; 200 with duplicate=true if an emergency for the same astronaut was activated
        within the last 10 minutes.
      operationId: activate_emergency_api_v1_emergencies_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyOut'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AnchorOut:
      properties:
        anchor_id:
          type: string
          title: Anchor Id
        zone_id:
          type: string
          title: Zone Id
        enabled:
          type: boolean
          title: Enabled
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Verified At
        verified_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Verified By
        data_category:
          type: string
          enum:
          - NASA_RESEARCH
          - SIMULATED_ASTRONAUT
          - SIMULATED_ENVIRONMENT_OR_DEVICE
          title: Data Category
          default: SIMULATED_ENVIRONMENT_OR_DEVICE
      type: object
      required:
      - anchor_id
      - zone_id
      - enabled
      - verified_at
      - verified_by
      title: AnchorOut
    AnchorPositionOut:
      properties:
        anchor_id:
          type: string
          title: Anchor Id
        zone_id:
          type: string
          title: Zone Id
        enabled:
          type: boolean
          title: Enabled
        point:
          items:
            type: number
          type: array
          title: Point
      type: object
      required:
      - anchor_id
      - zone_id
      - enabled
      - point
      title: AnchorPositionOut
    AnnotationKindOut:
      properties:
        kind:
          type: string
          enum:
          - surface_selection
          - region_classification
          - patient_reported_symptom
          - monitoring_concern
          - verified_finding
          title: Kind
        description:
          type: string
          title: Description
      type: object
      required:
      - kind
      - description
      title: AnnotationKindOut
    AssayRecord:
      properties:
        record_id:
          type: integer
          title: Record Id
        dataset_id:
          type: string
          enum:
          - OSD-575
          - OSD-656
          - NASA-EDA
          - NASA-RADLAB
          - OSD-654
          - OSD-684
          - OSD-573
          - OSD-817
          - OSD-195
          - OSD-546
          title: Dataset Id
        sample_name:
          type: string
          title: Sample Name
          description: '''Sample Name'' exactly as in the source, e.g. C001_urine_L-92.'
        subject_id:
          type: string
          title: Subject Id
          description: Anonymised research subject ID as published (e.g. C001).
        specimen:
          type: string
          title: Specimen
          description: Specimen type parsed from the sample name, e.g. urine.
        analyte:
          type: string
          title: Analyte
          description: Target name as in the column header, e.g. il6.
        measure:
          type: string
          enum:
          - concentration_npq
          - percent_normalized_value
          title: Measure
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Numeric value; null when the source says NA.
        value_raw:
          type: string
          title: Value Raw
        unit:
          type: string
          title: Unit
        timepoint:
          type: string
          title: Timepoint
        timepoint_phase:
          type: string
          enum:
          - PREFLIGHT
          - POSTFLIGHT
          title: Timepoint Phase
        timepoint_day_offset:
          type: integer
          title: Timepoint Day Offset
        timepoint_order:
          type: integer
          title: Timepoint Order
        target_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Name
          description: From the NASA target information file; null if no exact match.
        gene_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Gene Name
        uniprot_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Uniprot Id
        protein_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Protein Name
        source_file:
          type: string
          title: Source File
        source_row_number:
          type: integer
          title: Source Row Number
        source_column:
          type: string
          title: Source Column
          description: Exact column header in the source file.
        data_category:
          type: string
          enum:
          - NASA_RESEARCH
          - SIMULATED_ASTRONAUT
          - SIMULATED_ENVIRONMENT_OR_DEVICE
          title: Data Category
          default: NASA_RESEARCH
      type: object
      required:
      - record_id
      - dataset_id
      - sample_name
      - subject_id
      - specimen
      - analyte
      - measure
      - value
      - value_raw
      - unit
      - timepoint
      - timepoint_phase
      - timepoint_day_offset
      - timepoint_order
      - target_name
      - gene_name
      - uniprot_id
      - protein_name
      - source_file
      - source_row_number
      - source_column
      title: AssayRecord
      description: One value from a wide bio-assay table (BIO_ASSAY_TABLE), e.g. OSD-656 urine inflammation panel.
    AstronautOut:
      properties:
        astronaut_id:
          type: string
          title: Astronaut Id
        display_name:
          type: string
          title: Display Name
        role:
          type: string
          title: Role
        role_code:
          type: string
          enum:
          - crew_member
          - crew_medical_officer
          - flight_surgeon
          - ground_support
          title: Role Code
          description: Access role (2.7.0). Closing a monitoring concern and recomputing a baseline need crew_medical_officer
            or flight_surgeon.
          default: crew_member
        fictional:
          type: boolean
          title: Fictional
        mission:
          $ref: '#/components/schemas/Mission'
        data_category:
          type: string
          enum:
          - NASA_RESEARCH
          - SIMULATED_ASTRONAUT
          - SIMULATED_ENVIRONMENT_OR_DEVICE
          title: Data Category
          default: SIMULATED_ASTRONAUT
      type: object
      required:
      - astronaut_id
      - display_name
      - role
      - fictional
      - mission
      title: AstronautOut
    Attention:
      properties:
        priority:
          type: string
          enum:
          - routine
          - urgent
          title: Priority
        interrupt:
          type: boolean
          title: Interrupt
          description: True only for urgent items; routine items are noninterruptive.
        reason:
          type: string
          title: Reason
      type: object
      required:
      - priority
      - interrupt
      - reason
      title: Attention
    AuditOut:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        actor:
          type: string
          title: Actor
        action:
          type: string
          title: Action
        entity_type:
          type: string
          title: Entity Type
        entity_id:
          type: string
          title: Entity Id
        details:
          type: object
          title: Details
      type: object
      required:
      - timestamp
      - actor
      - action
      - entity_type
      - entity_id
      - details
      title: AuditOut
    BaselineList:
      properties:
        astronaut_id:
          type: string
          title: Astronaut Id
        method_id:
          type: string
          title: Method Id
        method_description:
          type: string
          title: Method Description
        baselines:
          items:
            $ref: '#/components/schemas/BaselineOut'
          type: array
          title: Baselines
      type: object
      required:
      - astronaut_id
      - method_id
      - method_description
      - baselines
      title: BaselineList
    BaselineOut:
      properties:
        baseline_id:
          type: string
          title: Baseline Id
        astronaut_id:
          type: string
          title: Astronaut Id
        type:
          type: string
          title: Type
        unit:
          type: string
          title: Unit
        version:
          type: integer
          title: Version
        status:
          type: string
          enum:
          - active
          - superseded
          title: Status
        method_id:
          type: string
          title: Method Id
        centre:
          type: number
          title: Centre
        spread:
          type: number
          title: Spread
        sample_count:
          type: integer
          title: Sample Count
        excluded_count:
          type: integer
          title: Excluded Count
          description: Readings left out because they were observed while a monitoring concern was open.
        window_start:
          type: string
          format: date-time
          title: Window Start
        window_end:
          type: string
          format: date-time
          title: Window End
        source_observation_ids:
          items:
            type: string
          type: array
          title: Source Observation Ids
        created_at:
          type: string
          format: date-time
          title: Created At
        created_by:
          type: string
          title: Created By
        reason:
          type: string
          title: Reason
        superseded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Superseded At
        frozen:
          type: boolean
          title: Frozen
          description: True while a monitoring concern for this type is not closed; recompute is refused.
        frozen_by_concern_id:
