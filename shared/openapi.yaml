components:
  schemas:
    AnchorOut:
      properties:
        anchor_id:
          type: string
          title: Anchor Id
        zone_id:
          type: string
          title: Zone Id
        enabled:
          type: boolean
          title: Enabled
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Verified At
        verified_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Verified By
        data_category:
          type: string
          enum:
          - NASA_RESEARCH
          - SIMULATED_ASTRONAUT
          - SIMULATED_ENVIRONMENT_OR_DEVICE
          title: Data Category
          default: SIMULATED_ENVIRONMENT_OR_DEVICE
      type: object
      required:
      - anchor_id
      - zone_id
      - enabled
      - verified_at
      - verified_by
      title: AnchorOut
    AssayRecord:
      properties:
        record_id:
          type: integer
          title: Record Id
        dataset_id:
          type: string
          enum:
          - OSD-575
          - OSD-656
          - NASA-EDA
          - NASA-RADLAB
          - OSD-654
          - OSD-684
          - OSD-573
          - OSD-817
          - OSD-195
          - OSD-546
          title: Dataset Id
        sample_name:
          type: string
          title: Sample Name
          description: '''Sample Name'' exactly as in the source, e.g. C001_urine_L-92.'
        subject_id:
          type: string
          title: Subject Id
          description: Anonymised research subject ID as published (e.g. C001).
        specimen:
          type: string
          title: Specimen
