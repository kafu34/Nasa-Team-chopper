  /api/v1/radiation/timeseries:
    get:
      tags:
      - research
      summary: NASA radiation dosimetry timeseries (RadLab ISS snapshot; 503 until imported)
      description: 'Readings from a saved NASA RadLab API snapshot (ISS, 2022-04-01 UTC). metric defaults to absorbed_dose_rate
        (μGy/hour). Filters: instrument_id, start (inclusive), end (exclusive). Points are ordered by timestamp then instrument.
        Research context only: never live HAB-01 readings or an astronaut''s personal dose.'
      operationId: radiation_timeseries_api_v1_radiation_timeseries_get
      parameters:
      - name: dataset_id
        in: query
        required: false
        schema:
          type: string
          default: NASA-RADLAB
          title: Dataset Id
      - name: metric
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
