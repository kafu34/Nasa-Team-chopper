          title: Mesh Id
          description: Optional (2.2.0). Mesh the point lies on. Validated when the model manifest declares its meshes.
        attachment:
          anyOf:
          - $ref: '#/components/schemas/SurfaceAttachment'
          - type: 'null'
          description: Optional (2.2.0). Triangle + barycentric position on mesh_id, for markers that stay attached when the
            model is posed or re-rendered.
        mesh_local_point:
          anyOf:
          - $ref: '#/components/schemas/MeshLocalPoint'
          - type: 'null'
          description: Optional (2.3.0). The point in mesh_id's local coordinates. Checked against the mesh's declared transform
            when the model manifest declares one.
      additionalProperties: false
      type: object
      required:
      - model_id
      - site_id
      - x
      - y
      - z
      title: SurfacePoint
      description: A tapped point on a registered 3D Anatomical Twin model. A diagram location, not a measurement.
    SurfacePointOut:
      properties:
        model_id:
          type: string
          title: Model Id
        model_version:
          type: string
          title: Model Version
          description: Version the point was reported on (1.0.0 for points stored before contract 2.2.0).
        site_id:
          type: string
          title: Site Id
        site_label:
          type: string
          title: Site Label
        x:
          type: number
          title: X
        y:
          type: number
          title: Y
        z:
          type: number
          title: Z
        mesh_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Mesh Id
        mesh_validation:
          type: string
          enum:
          - not_supplied
          - not_declared_by_model
          - validated
          title: Mesh Validation
          default: not_supplied
        attachment:
          anyOf:
          - type: object
          - type: 'null'
          title: Attachment
        mesh_local_point:
          anyOf:
